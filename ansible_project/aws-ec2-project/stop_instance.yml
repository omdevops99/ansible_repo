---
- name: Stop AWS EC2 instances
  hosts: localhost
  connection: local

  tasks:

    - name: Stop EC2 instances
      amazon.aws.ec2_instance:
        state: stopped
        region: "{{ aws_region }}"
        access_key: "{{ aws_access_key }}"
        secret_key: "{{ aws_secret_key }}"
        filters:
          "tag:Name":
            - "ubuntu-server"
            - "debian-server"
            - "centos-server"