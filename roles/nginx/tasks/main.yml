---
# tasks file for roles/nginx
- name: Update the package
  ansible.builtin.apt:
    update_cache: yes

- name: Install Nginx
  ansible.builtin.apt:
     name: nginx
     state: present
- name: start Nginx
  ansible.builtin.service:
      name: nginx
      state: started
      enabled: True
    

